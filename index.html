<title>保育士試験 問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EE;
    --card: #FFFFFF;
    --ink: #2D2A26;
    --sub: #77706A;
    --line: #E8E1D5;
    --accent: #3F7A5A;
    --accent-soft: #E3EFE7;
    --wrong: #C0573F;
    --wrong-soft: #F8E6E1;
    --sun: #E7A93C;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  button, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { -webkit-appearance: none; appearance: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(64px, calc(env(safe-area-inset-bottom) + 32px)) max(18px, env(safe-area-inset-left)); }
  h1, h2, h3, .maru { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* header */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand .badge {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 3px 10px;
  }
  h1 { font-size: 26px; margin: 6px 0 2px; letter-spacing: .02em; }
  .lead { color: var(--sub); font-size: 14px; margin: 0 0 22px; }

  /* overall */
  .overall {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 18px;
  }
  .stat { text-align: center; }
  .stat .num { font-family: "Zen Maru Gothic", sans-serif; font-size: 26px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--sub); }

  /* mode buttons */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .mode {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; text-align: left; transition: transform .08s, border-color .15s;
  }
  @media (hover: hover) { .mode:hover { border-color: var(--accent); } }
  .mode:active { transform: scale(.98); }
  .mode .t { font-weight: 700; font-size: 15px; display: block; }
  .mode .d { font-size: 12px; color: var(--sub); }
  .mode.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mode.primary .d { color: rgba(255,255,255,.8); }
  .mode:disabled { opacity: .45; cursor: default; }

  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; color: var(--sub); }

  /* category list */
  .cats { display: flex; flex-direction: column; gap: 10px; }
  .cat {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
    text-align: left; transition: border-color .15s;
  }
  @media (hover: hover) { .cat:hover { border-color: var(--accent); } }
  .cat .ic { font-size: 22px; text-align: center; }
  .cat .name { font-weight: 700; font-size: 15px; display: block; line-height: 1.4; }
  .cat .meta { font-size: 12px; color: var(--sub); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .cat .rate { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 18px; min-width: 48px; text-align: right; }
  .cat .rate small { font-size: 11px; color: var(--sub); font-weight: 500; }

  .foot { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
  .foot .links { display: flex; gap: 6px; }
  .link-btn { background: none; border: none; color: var(--sub); text-decoration: underline; padding: 10px 6px; font-size: 13px; }

  /* quiz */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .back { min-height: 36px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--card); }
  .progress { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--sun); transition: width .3s; }
  .count { font-size: 13px; color: var(--sub); min-width: 48px; text-align: right; }

  .qcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; }
  .qcat { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .qtext { font-size: 17px; font-weight: 500; margin: 0 0 18px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    min-height: 52px;
    display: grid; grid-template-columns: 30px 1fr 22px; gap: 10px; align-items: center;
    text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; transition: border-color .15s, background .15s;
  }
  @media (hover: hover) { .opt:hover:not(:disabled) { border-color: var(--accent); background: #FBFDFB; } }
  .opt .k {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line);
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--sub);
  }
  .opt .mk { font-weight: 700; text-align: center; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--accent); background: var(--accent-soft); }
  .opt.correct .k { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct .mk { color: var(--accent); }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
  .opt.wrong .k { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .opt.wrong .mk { color: var(--wrong); }
  .opt.dim { opacity: .55; }

  .explain { margin-top: 16px; border-radius: 12px; padding: 14px 16px; font-size: 14px; display: none; }
  .explain.show { display: block; animation: rise .25s ease-out; }
  .explain.ok { background: var(--accent-soft); }
  .explain.ng { background: var(--wrong-soft); }
  .explain .verdict { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .explain.ok .verdict { color: var(--accent); }
  .explain.ng .verdict { color: var(--wrong); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .next {
    margin-top: 16px; width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 12px;
    padding: 14px; font-weight: 700; font-size: 15px; display: none;
  }
  .next.show { display: block; }
  .hint { font-size: 12px; color: var(--sub); text-align: center; margin-top: 10px; }

  /* result */
  .result-hero { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 20px; margin-bottom: 18px; }
  .ring { width: 140px; height: 140px; margin: 0 auto 10px; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Zen Maru Gothic", sans-serif; }
  .ring .val b { font-size: 34px; display: block; line-height: 1; }
  .ring .val span { font-size: 12px; color: var(--sub); }
  .msg { font-family: "Zen Maru Gothic", sans-serif; font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
  .submsg { font-size: 13px; color: var(--sub); margin: 0; }
  .missed { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .missed-item { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--wrong); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .missed-item .ans { color: var(--accent); font-weight: 700; margin-top: 4px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border-radius: 12px; padding: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--card); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* dialog */
  .modal { position: fixed; inset: 0; background: rgba(45,42,38,.4); display: none; place-items: center; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 10; }
  .modal.show { display: grid; }
  .modal .box { max-height: 100%; overflow-y: auto; background: #fff; border-radius: var(--radius); padding: 22px; max-width: 360px; width: 100%; }
  .modal p { margin: 0 0 16px; }


  /* exam-style */
  .qtext { white-space: pre-line; }
  .stmts { background: #FBF8F2; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; font-size: 14.5px; }
  .stmts div + div { margin-top: 8px; }
  .stmts.pool { background: #F4F8F5; }
  .tag-exam { display: inline-block; font-size: 11px; font-weight: 700; color: #8A5A12; background: #FBEFD9; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
  .combo-head, .opt.combo { display: grid; grid-template-columns: 30px repeat(var(--n), 1fr) 22px; gap: 8px; align-items: center; }
  .combo-head { font-size: 12px; font-weight: 700; color: var(--sub); padding: 0 15px 2px; text-align: center; }
  .opt.combo .v { text-align: center; font-size: 14px; }
  .opt.combo.marks .v { font-size: 18px; font-weight: 700; }
  .sync { display: inline-flex; align-items: center; gap: 6px; }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: #C9C1B4; display: inline-block; }
  .sync.on i { background: var(--accent); }
  .sync.err i { background: var(--wrong); }

  textarea { font-size: 16px; }
  @media (hover: none) { .hint { display: none; } }
  .install { display: none; margin-top: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--sub); }
  .install.show { display: block; }

  /* subject grid */
  .subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .subj { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 12px; text-align: left;
          display: grid; grid-template-columns: 1fr auto; grid-template-areas: "ic rate" "name name" "meta meta" "bar bar"; row-gap: 2px; min-height: 120px; }
  @media (hover: hover) { .subj:hover { border-color: var(--accent); } }
  .subj:active { transform: scale(.98); }
  .subj .ic { grid-area: ic; font-size: 26px; line-height: 1.2; }
  .subj .rate { grid-area: rate; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 18px; }
  .subj .rate small { font-size: 11px; color: var(--sub); font-weight: 500; }
  .subj .name { grid-area: name; font-weight: 700; font-size: 16px; margin-top: 4px; }
  .subj .meta { grid-area: meta; font-size: 12px; color: var(--sub); }
  .subj .bar { grid-area: bar; margin-top: 8px; }
  .note { font-size: 12px; color: var(--sub); margin: 14px 2px 0; }
  .tag-subj { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  @media (max-width: 420px) { .subjects { grid-template-columns: 1fr 1fr; } .subj { min-height: 112px; padding: 12px; } .subj .name { font-size: 14.5px; } }

  @media (max-width: 420px) {
    h1 { font-size: 22px; }
    .qtext { font-size: 16px; }
    .modes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="modal" id="modal">
  <div class="box">
    <p><span id="modal-text">学習記録をリセットしますか？</span><br><small style="color:var(--sub)">この操作は取り消せません。</small></p>
    <div class="actions">
      <button class="btn" id="modal-cancel">やめる</button>
      <button class="btn dark" id="modal-ok" style="background:var(--wrong);border-color:var(--wrong)">リセット</button>
    </div>
  </div>
</div>

<div class="modal" id="xfer">
  <div class="box" style="max-width:420px">
    <h3 class="maru" style="margin:0 0 6px;font-size:18px">記録の引き継ぎ</h3>
    <p style="font-size:13px;color:var(--sub);margin:0 0 12px">ログインしていなくても、コードを使って別の端末やブラウザへ学習記録を移せます。</p>
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">① この端末の記録を書き出す</div>
    <textarea id="xfer-out" readonly style="width:100%;height:64px;font-size:16px;font-family:monospace;border:1px solid var(--line);border-radius:10px;padding:8px;resize:none"></textarea>
    <button class="btn dark" id="xfer-copy" style="width:100%;margin:6px 0 14px">コードをコピー</button>
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">② 別の端末で読み込む</div>
    <textarea id="xfer-in" placeholder="ここにコードを貼り付け" style="width:100%;height:64px;font-size:16px;font-family:monospace;border:1px solid var(--line);border-radius:10px;padding:8px;resize:none"></textarea>
    <p id="xfer-msg" style="font-size:13px;margin:4px 0 8px;min-height:1.2em"></p>
    <div class="actions">
      <button class="btn" id="xfer-close">閉じる</button>
      <button class="btn dark" id="xfer-load" style="background:var(--accent);border-color:var(--accent)">読み込む</button>
    </div>
  </div>
</div>

<script>window.SUBJECTS=[];function registerSubject(s){window.SUBJECTS.push(s);}</script>
<script src="subjects/hoiku-genri.js"></script>
<script src="subjects/kyouiku-genri.js"></script>
<script src="subjects/shakaiteki-yougo.js"></script>
<script src="subjects/kodomo-katei-fukushi.js"></script>
<script src="subjects/shakai-fukushi.js"></script>
<script src="subjects/hoiku-shinri.js"></script>
<script src="subjects/kodomo-hoken.js"></script>
<script src="subjects/shoku-eiyou.js"></script>
<script src="subjects/jisshu-riron.js"></script>
<script src="app.js"></script>
</body>
